# ===============================================
#  Unified Configuration for MT EN→DE Transformer
# ===============================================

data:
  train_en: "data/processed/train.en"
  train_de: "data/processed/train.de"
  valid_en: "data/processed/valid.en"
  valid_de: "data/processed/valid.de"
  test_en:  "data/processed/test.en"
  test_de:  "data/processed/test.de"

tokenizer:
  spm_model: "models/bpe/spm.model"
  spm_vocab_size: 32000

model:
  num_encoder_layers: 4
  num_decoder_layers: 4
  d_model: 384
  d_ff: 1536
  nhead: 6
  dropout: 0.1

dataloader:
  max_source_len: 128
  max_target_len: 128
  max_tokens_per_batch: 3500
  num_workers: 2

train:
  num_epochs: 10

  optimizer:
    betas: [0.9, 0.98] 
    lr: 5e-5         # FIXED for stability
    eps: 1e-9

  warmup_steps: 4000    # REAL dataset needs proper warmup
  grad_accum_steps: 4
  label_smoothing: 0.1
  use_amp: true

  checkpoint_dir: "models/checkpoints"
  checkpoint_every_steps: 5000
  max_grad_norm: 0.3

